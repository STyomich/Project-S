<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo/Brand -->
    <div class="navbar-brand">
      <a routerLink="/" class="logo">
        <span class="logo-icon">⚙️</span>
        Project S
      </a>
    </div>

    <!-- Navigation Links -->
    <ul class="navbar-menu">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
      <li><a routerLink="/about" routerLinkActive="active">About</a></li>
      <li><a routerLink="/services" routerLinkActive="active">Services</a></li>
      <li><a routerLink="/contact" routerLinkActive="active">Contact</a></li>
    </ul>

    <!-- Auth Section -->
    <div class="navbar-auth">
      @if (isLoggedIn) {
        <!-- User Dropdown -->
        <div class="user-menu">
          <button class="user-button" (click)="toggleDropdown()">
            <span class="user-avatar">👤</span>
            <span class="user-name">{{ userName }}</span>
            <span class="dropdown-arrow">▼</span>
          </button>

          @if (isDropdownOpen) {
            <div class="dropdown-menu">
              <a routerLink="/profile" class="dropdown-item" (click)="closeDropdown()">
                <span>👤</span> My Profile
              </a>
              <a routerLink="/settings" class="dropdown-item" (click)="closeDropdown()">
                <span>⚙️</span> Settings
              </a>
              <div class="dropdown-divider"></div>
              <button (click)="logout()" class="dropdown-item logout-btn">
                <span>🚪</span> Logout
              </button>
            </div>
          }
        </div>
      } @else {
        <!-- Login/Register Buttons -->
        <div class="auth-buttons">
          <a routerLink="/login" class="btn-link btn-login">Login</a>
          <a routerLink="/register" class="btn-link btn-register">Register</a>
        </div>
      }
    </div>
  </div>
</nav>
