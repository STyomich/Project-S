apiVersion: v1
kind: Service
metadata:
  name: apigateway
  namespace: project-s-namespace
spec:
  selector:
    app: apigateway
  ports:
    - protocol: TCP
      port: 8080      # The port that will be exposed externally
      targetPort: 5000  # The port on the apigateway container
  type: LoadBalancer  # Exposes the service externally using the Azure's load balancer
  
