version: "3.9"

services:
  gateway:
    build:
      context: ./ProjectS.Gateway
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      USERS_API_URL: http://users.api:8080
      TokenKey: "LoremipsumdolorsitametconsecteturadipiscingelitCurabiturauctoridmagnasedegestasNullamquisnequesedrisusmalesuadalaciniaSuspendisseaciniaeratnecexfacilisisinvenenatissapiencondimentumDonecacexacipsumluctuseleifend"

  users.api:
    build:
      context: ./ProjectS.UsersService
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
      - redis
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: Users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: user
      RABBITMQ_PASSWORD: password
      RABBITMQ_PORT: 5672
      RABBITMQ_EXCHANGE: user.exchange
      TokenKey: "LoremipsumdolorsitametconsecteturadipiscingelitCurabiturauctoridmagnasedegestasNullamquisnequesedrisusmalesuadalaciniaSuspendisseaciniaeratnecexfacilisisinvenenatissapiencondimentumDonecacexacipsumluctuseleifend"

  notifications.api:
    build:
      context: .
      dockerfile: ProjectS.NotificationsService/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - rabbitmq
      - mysql
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: Notifications
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: user
      RABBITMQ_PASSWORD: password
      RABBITMQ_PORT: 5672
      RABBITMQ_USERS_EXCHANGE: user.exchange

  rabbitmq:
    image: rabbitmq:4.2.2-management
    container_name: projects_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  redis:
    image: redis:latest
    container_name: projects_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - projects_redis_data:/data

  postgres:
    image: postgres:16
    container_name: users_postgres
    restart: always
    environment:
      POSTGRES_DB: Users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    container_name: notifications_mysql
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: Notifications
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    
  mongodb:
    image: mongo:8.2.3-noble
    container_name: utilities_mongodb
    restart: always
    environment:
      MONGODB_CONNECTION_STRING: mongodb://mongo:27017
      MONGODB_DATABASE: Utilities
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  projects_redis_data:
  postgres_data:
  mysql_data:
  mongodb_data: