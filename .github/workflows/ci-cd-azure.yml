name: CI/CD - Build, Test & Deploy to Azure

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  # ============================================
  # BACKEND TESTS - .NET Services
  # ============================================
  backend-tests:
    name: Backend Tests - .NET
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - UsersService
          - NotificationsService
          - UtilitiesService
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies - ${{ matrix.service }}
        run: |
          cd src/ProjectS.${{ matrix.service }}
          dotnet restore

      - name: Build - ${{ matrix.service }}
        run: |
          cd src/ProjectS.${{ matrix.service }}
          dotnet build --configuration Release --no-restore

      - name: Run unit tests - ${{ matrix.service }}
        run: |
          cd src/ProjectS.${{ matrix.service }}
          dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.service }}
          path: src/ProjectS.${{ matrix.service }}/**/TestResults/

  # ============================================
  # GATEWAY TESTS - .NET
  # ============================================
  gateway-tests:
    name: Gateway Tests - .NET
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies - Gateway
        run: |
          cd src/ProjectS.Gateway
          dotnet restore

      - name: Build - Gateway
        run: |
          cd src/ProjectS.Gateway
          dotnet build --configuration Release --no-restore

  # ============================================
  # FRONTEND TESTS - Angular
  # ============================================
  frontend-tests:
    name: Frontend Tests - Angular
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/project-s-frontend-app/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend/project-s-frontend-app
          npm ci

      - name: Run linting
        run: |
          cd frontend/project-s-frontend-app
          npm run lint || true

      - name: Run unit tests
        run: |
          cd frontend/project-s-frontend-app
          npm test -- --run

      - name: Build Angular app
        run: |
          cd frontend/project-s-frontend-app
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: angular-build
          path: frontend/project-s-frontend-app/dist/

  # ============================================
  # BUILD DOCKER IMAGES
  # ============================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, gateway-tests, frontend-tests]
    if: github.event_name == 'push'
    strategy:
      matrix:
        service:
          - name: gateway
            path: src/ProjectS.Gateway
          - name: users-service
            path: src/ProjectS.UsersService
          - name: notifications-service
            path: src/ProjectS.NotificationsService
          - name: utilities-service
            path: src/ProjectS.UtilitiesService
          - name: frontend
            path: frontend/project-s-frontend-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image - ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.path }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/project-s-${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/project-s-${{ matrix.service.name }}:latest-${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}-${{ github.sha }}

  # ============================================
  # PREPARE DEPLOYMENT
  # ============================================
  prepare-deployment:
    name: Prepare Environment Files
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env files from secrets
        run: |
          mkdir -p deployment
          
          # Create backend environment file
          cat > deployment/.env.backend << 'EOF'
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          POSTGRES_DATABASE=${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          
          MYSQL_HOST=${{ secrets.MYSQL_HOST }}
          MYSQL_PORT=${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          
          MONGODB_CONNECTION_STRING=${{ secrets.MONGODB_CONNECTION_STRING }}
          MONGODB_DATABASE=${{ secrets.MONGODB_DATABASE }}
          
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          
          RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_USERS_EXCHANGE=${{ secrets.RABBITMQ_USERS_EXCHANGE }}
          
          TokenKey=${{ secrets.TOKEN_KEY }}
          JWT_ISSUER=${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
          EOF
          
          # Create frontend environment file
          cat > deployment/.env.frontend << 'EOF'
          API_URL=${{ secrets.API_URL }}
          ENVIRONMENT=${{ github.ref_name }}
          EOF
          
          # Create docker-compose override for deployment
          cat > deployment/docker-compose.override.yml << 'EOF'
          version: '3.8'
          services:
            gateway:
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - TokenKey=${{ secrets.TOKEN_KEY }}
                - USERS_API_URL=http://users.api:8080
            
            users.api:
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
                - POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
                - POSTGRES_DATABASE=${{ secrets.POSTGRES_DATABASE }}
                - POSTGRES_USER=${{ secrets.POSTGRES_USER }}
                - POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
                - REDIS_HOST=${{ secrets.REDIS_HOST }}
                - REDIS_PORT=${{ secrets.REDIS_PORT }}
                - RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
                - RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}
                - RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
                - RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
                - TokenKey=${{ secrets.TOKEN_KEY }}
            
            notifications.api:
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - MYSQL_HOST=${{ secrets.MYSQL_HOST }}
                - MYSQL_PORT=${{ secrets.MYSQL_PORT }}
                - MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
                - MYSQL_USER=${{ secrets.MYSQL_USER }}
                - MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
                - RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
                - RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}
                - RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
                - RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
                - RABBITMQ_USERS_EXCHANGE=${{ secrets.RABBITMQ_USERS_EXCHANGE }}
            
            utilities.api:
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - MONGODB_CONNECTION_STRING=${{ secrets.MONGODB_CONNECTION_STRING }}
                - MONGODB_DATABASE=${{ secrets.MONGODB_DATABASE }}
                - RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
                - RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}
                - RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
                - RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          EOF

      - name: Upload environment files
        uses: actions/upload-artifact@v3
        with:
          name: deployment-env
          path: deployment/

  # ============================================
  # DEPLOY TO AZURE - Dev Environment
  # ============================================
  deploy-dev:
    name: Deploy to Azure - Dev
    runs-on: ubuntu-latest
    needs: [prepare-deployment]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment:
      name: development
      url: https://project-s-dev.azurewebsites.net
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download environment files
        uses: actions/download-artifact@v3
        with:
          name: deployment-env
          path: deployment

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Instances (Gateway)
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az container create \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name project-s-gateway-dev \
              --image ${{ env.REGISTRY }}/project-s-gateway:${{ github.sha }} \
              --cpu 1 --memory 1 \
              --registry-login-server ${{ env.REGISTRY }} \
              --registry-username ${{ secrets.AZURE_REGISTRY_USERNAME }} \
              --registry-password ${{ secrets.AZURE_REGISTRY_PASSWORD }} \
              --ports 5000 \
              --environment-variables-from-file deployment/.env.backend \
              --ip-address Public

      - name: Deploy UsersService to Azure Container Instances
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az container create \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name project-s-users-service-dev \
              --image ${{ env.REGISTRY }}/project-s-users-service:${{ github.sha }} \
              --cpu 1 --memory 1 \
              --registry-login-server ${{ env.REGISTRY }} \
              --registry-username ${{ secrets.AZURE_REGISTRY_USERNAME }} \
              --registry-password ${{ secrets.AZURE_REGISTRY_PASSWORD }} \
              --ports 8080 \
              --environment-variables-from-file deployment/.env.backend \
              --ip-address Private

      - name: Deploy NotificationsService to Azure Container Instances
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az container create \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name project-s-notifications-service-dev \
              --image ${{ env.REGISTRY }}/project-s-notifications-service:${{ github.sha }} \
              --cpu 1 --memory 1 \
              --registry-login-server ${{ env.REGISTRY }} \
              --registry-username ${{ secrets.AZURE_REGISTRY_USERNAME }} \
              --registry-password ${{ secrets.AZURE_REGISTRY_PASSWORD }} \
              --ports 8081 \
              --environment-variables-from-file deployment/.env.backend \
              --ip-address Private

      - name: Deploy UtilitiesService to Azure Container Instances
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az container create \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name project-s-utilities-service-dev \
              --image ${{ env.REGISTRY }}/project-s-utilities-service:${{ github.sha }} \
              --cpu 1 --memory 1 \
              --registry-login-server ${{ env.REGISTRY }} \
              --registry-username ${{ secrets.AZURE_REGISTRY_USERNAME }} \
              --registry-password ${{ secrets.AZURE_REGISTRY_PASSWORD }} \
              --ports 8082 \
              --environment-variables-from-file deployment/.env.backend \
              --ip-address Private

      - name: Deploy Frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend/project-s-frontend-app/dist'
          skip_app_build: true
          deployment_environment: 'development'

      - name: Deployment Success Notification
        if: success()
        run: echo "✅ Dev deployment completed successfully"

      - name: Deployment Failure Notification
        if: failure()
        run: echo "❌ Dev deployment failed"

  # ============================================
  # DEPLOY TO AZURE - Production Environment
  # ============================================
  deploy-prod:
    name: Deploy to Azure - Production
    runs-on: ubuntu-latest
    needs: [prepare-deployment]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://project-s.azurewebsites.net
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download environment files
        uses: actions/download-artifact@v3
        with:
          name: deployment-env
          path: deployment

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Kubernetes Service (AKS)
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing
          
          # Update Kubernetes deployments with new images
          kubectl set image deployment/project-s-gateway \
            gateway=${{ env.REGISTRY }}/project-s-gateway:${{ github.sha }} \
            -n project-s-prod
          
          kubectl set image deployment/project-s-users-service \
            users-service=${{ env.REGISTRY }}/project-s-users-service:${{ github.sha }} \
            -n project-s-prod
          
          kubectl set image deployment/project-s-notifications-service \
            notifications-service=${{ env.REGISTRY }}/project-s-notifications-service:${{ github.sha }} \
            -n project-s-prod
          
          kubectl set image deployment/project-s-utilities-service \
            utilities-service=${{ env.REGISTRY }}/project-s-utilities-service:${{ github.sha }} \
            -n project-s-prod
          
          # Rollout status check
          kubectl rollout status deployment/project-s-gateway -n project-s-prod --timeout=5m
          kubectl rollout status deployment/project-s-users-service -n project-s-prod --timeout=5m
          kubectl rollout status deployment/project-s-notifications-service -n project-s-prod --timeout=5m
          kubectl rollout status deployment/project-s-utilities-service -n project-s-prod --timeout=5m

      - name: Deploy Frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend/project-s-frontend-app/dist'
          skip_app_build: true
          deployment_environment: 'production'

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against production API..."
          # Add your smoke test commands here
          curl -f https://project-s.azurewebsites.net/api/health || exit 1

      - name: Deployment Success Notification
        if: success()
        run: echo "✅ Production deployment completed successfully"

      - name: Deployment Failure Notification
        if: failure()
        run: echo "❌ Production deployment failed - rolling back"

  # ============================================
  # CLEANUP OLD IMAGES
  # ============================================
  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-prod]
    if: always()
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete untagged images older than 7 days
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            REPOSITORY=${{ secrets.AZURE_REGISTRY_NAME }}
            DAYS_OLD=7
            CUTOFF_DATE=$(date -d "$DAYS_OLD days ago" +"%Y-%m-%dT%H:%M:%SZ")
            
            az acr repository list --name $REPOSITORY --query "[].{repo: @}" -o tsv | while read repo; do
              az acr manifest list-metadata --registry $REPOSITORY --repository $repo \
                --orderby time_desc | grep -A1 "$CUTOFF_DATE" | grep "digest" | cut -d'"' -f4 | \
                xargs -I {} az acr repository delete --name $REPOSITORY --image "$repo@{}" --yes || true
            done
