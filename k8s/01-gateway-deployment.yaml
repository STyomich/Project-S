apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-s-gateway
  namespace: project-s-prod
  labels:
    app: gateway
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        version: v1
    spec:
      serviceAccountName: gateway-sa
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: gateway
        image: projectsregistry.azurecr.io/project-s-gateway:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        - name: TokenKey
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: TokenKey
        - name: JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: JWT_ISSUER
        - name: JWT_AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: JWT_AUDIENCE
        - name: USERS_API_URL
          value: "http://project-s-users-service:8080"
        - name: NOTIFICATIONS_API_URL
          value: "http://project-s-notifications-service:8081"
        - name: UTILITIES_API_URL
          value: "http://project-s-utilities-service:8082"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: project-s-gateway
  namespace: project-s-prod
  labels:
    app: gateway
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: http
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: project-s-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: project-s-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: project-s-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
