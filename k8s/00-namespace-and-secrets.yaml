apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: project-s-prod
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  JWT_ISSUER: "https://project-s.azurewebsites.net"
  JWT_AUDIENCE: "project-s-api"
  RABBITMQ_USERS_EXCHANGE: "user.exchange"
  MONGODB_DATABASE: "Utilities"
  POSTGRES_DATABASE: "usersdb"
  MYSQL_DATABASE: "notificationsdb"
---
apiVersion: v1
kind: Namespace
metadata:
  name: project-s-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: project-s-dev
---
# PostgreSQL Secret (UsersService)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: project-s-prod
type: Opaque
stringData:
  POSTGRES_HOST: "project-s-postgres.postgres.database.azure.com"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "YourSecurePassword123!"
  POSTGRES_DATABASE: "usersdb"
---
# MySQL Secret (NotificationsService)
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: project-s-prod
type: Opaque
stringData:
  MYSQL_HOST: "project-s-mysql.mysql.database.azure.com"
  MYSQL_PORT: "3306"
  MYSQL_USER: "adminuser"
  MYSQL_PASSWORD: "YourSecurePassword123!"
  MYSQL_DATABASE: "notificationsdb"
---
# MongoDB Secret (UtilitiesService)
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: project-s-prod
type: Opaque
stringData:
  MONGODB_CONNECTION_STRING: "mongodb://project-s-mongo.mongo.cosmos.azure.com:10255/?ssl=true&replicaSet=globaldb&maxIdleTimeMS=120000&appName=@project-s-mongo"
  MONGODB_DATABASE: "Utilities"
---
# Redis Secret
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: project-s-prod
type: Opaque
stringData:
  REDIS_HOST: "project-s-redis.redis.cache.windows.net"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "YourRedisPassword123!"
---
# RabbitMQ Secret
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: project-s-prod
type: Opaque
stringData:
  RABBITMQ_HOST: "project-s-rabbitmq.servicebus.windows.net"
  RABBITMQ_PORT: "5671"
  RABBITMQ_USERNAME: "project-s"
  RABBITMQ_PASSWORD: "YourRabbitMQPassword123!"
---
# JWT Secret
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: project-s-prod
type: Opaque
stringData:
  TokenKey: "your-256-bit-secret-key-base64-encoded-minimum-32-characters"
---
# ACR Image Pull Secret
apiVersion: v1
kind: Secret
metadata:
  name: acr-secret
  namespace: project-s-prod
type: docker.io/dockercfg
data:
  .dockercfg: <base64-encoded-docker-config>
---
# Gateway Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: project-s-prod
---
# Gateway RBAC Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-role
  namespace: project-s-prod
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
---
# Gateway RBAC RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-rolebinding
  namespace: project-s-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-role
subjects:
- kind: ServiceAccount
  name: gateway-sa
  namespace: project-s-prod
---
# PersistentVolumeClaim for logs (optional)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-logs-pvc
  namespace: project-s-prod
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile
  resources:
    requests:
      storage: 10Gi
---
# NetworkPolicy for service isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: project-s-network-policy
  namespace: project-s-prod
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
